name: Build SorenWare from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf android-project
          mkdir android-project
          unzip -q "$ZIP_FILE" -d android-project

          # If the ZIP contains one top-level directory, use it as project root.
          shopt -s dotglob nullglob
          entries=(android-project/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            inner="${entries[0]}"
            mv "$inner"/* android-project/ 2>/dev/null || true
            mv "$inner"/.[!.]* android-project/ 2>/dev/null || true
            rmdir "$inner" 2>/dev/null || true
          fi

          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        working-directory: android-project
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
            chmod +x ./gradlew
          fi
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SorenWare-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
